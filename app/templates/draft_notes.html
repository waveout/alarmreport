{% extends 'base.html' %}
{% block title %}Draft Notes{% endblock %}
{% block heading %}Draft Notes{% endblock %}
{% block content %}
<div class="panel">
  <h3>New Draft Note</h3>
  <form method="post" class="form-card">
    <label class="full">Note<textarea name="content" rows="4" required></textarea></label>
    <button type="submit" class="btn btn-primary">Save Draft</button>
  </form>
</div>
<div class="panel">
  <h3>Saved Drafts</h3>
  <table>
    <thead><tr><th>Note</th><th>Updated</th><th></th></tr></thead>
    <tbody>
      {% for n in notes %}
      <tr>
        <td>{{ n['content'] }}</td>
        <td>{{ n['updated_at'] }}</td>
        <td>
          <form method="post" action="{{ url_for('draft_notes.delete', note_id=n['id']) }}">
            <button type="submit" class="btn btn-sm">Delete</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="3">No draft notes yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
